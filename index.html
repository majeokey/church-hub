<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ebenezer Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral de navegación + lienzo operativo en escritorio; en móvil, header compacto + barra inferior de pestañas. Un solo look oscuro, deliberado. */
:root{
  --bg:#0A0C11; --surface:#11141B; --surface-2:#161A23; --raise:#1D2230;
  --line:#212736; --line-2:#2D3446;
  --fg:#E9EBF1; --muted:#8E95A8; --faint:#5E6578;
  --accent:#A3B4FF; --accent-dim:rgba(163,180,255,.11); --accent-ink:#0B0E18;
  --ok:#56CF95; --ok-dim:rgba(86,207,149,.12);
  --warn:#E8B755; --warn-dim:rgba(232,183,85,.12);
  --bad:#F27B7B; --bad-dim:rgba(242,123,123,.12);
  --sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
p{margin:0}
ul{list-style:none;margin:0;padding:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:22px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.brand-mark{width:28px;height:28px;flex:none}
.brand b{display:block;font-size:14px;letter-spacing:.14em;font-weight:600}
.brand small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.06em}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:var(--muted);text-align:left;font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--raise);color:var(--fg)}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;display:grid;gap:12px}
.whocard{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.whocard b{display:block;font-size:13px}
.whocard small{display:block;font-size:11.5px;color:var(--muted)}
.sig{display:flex;justify-content:space-between;align-items:center;padding:0 8px;font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.04em}
.linkbtn{border:0;background:none;padding:0;color:var(--muted);font-size:11px;font-family:var(--mono);text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--fg)}

.mainwrap{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 32px;background:rgba(10,12,17,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-l{display:flex;align-items:center;gap:12px;min-width:0}
.top-l .brand-mark{display:none}
.top h1{font-size:18px}
.top p{font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;padding:3px;gap:2px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;color:var(--muted);font-size:12.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:0 0 0 1px var(--line-2) inset}
.rolewrap{display:flex;align-items:center;gap:10px}
.rolewrap > span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--faint)}
main{padding:28px 32px 48px;display:grid;gap:20px;align-content:start;max-width:1280px;width:100%}
.tabbar{display:none}

/* Building blocks */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.panel-h .count{font-family:var(--mono);font-size:11px;color:var(--faint)}
.rows > li{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}
.rows > li:first-child{border-top:0}
.rows .grow{flex:1;min-width:0}
.rows .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:22px 16px;color:var(--muted);font-size:13px;text-align:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 13px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);font-size:13px;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--raise)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:#B6C4FF}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#06140D}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.lg{padding:12px 16px;font-size:14.5px;border-radius:10px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icobtn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--muted)}
.icobtn:hover{background:var(--raise);color:var(--fg)}
.icobtn svg{width:16px;height:16px}
.icobtn[disabled]{opacity:.3;cursor:default;background:transparent}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-dim)}
.pill.warn{color:var(--warn);background:var(--warn-dim)}
.pill.bad{color:var(--bad);background:var(--bad-dim)}
.pill.open{color:var(--muted);border:1px dashed var(--line-2)}
.pill.open::before{background:transparent;border:1px solid currentColor}
.pill.acc{color:var(--accent);background:var(--accent-dim)}
.tag{display:inline-flex;align-items:center;padding:1px 7px;border-radius:5px;background:var(--raise);color:var(--muted);font-size:11.5px;white-space:nowrap}
.av{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--raise);border:1px solid var(--line-2);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.av.lg{width:40px;height:40px;font-size:13px}

/* Dashboard */
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.quick button{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left;font-weight:500}
.quick button:hover{border-color:var(--line-2);background:var(--surface-2)}
.quick svg{width:18px;height:18px;color:var(--accent);flex:none}
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;padding:24px;border-radius:14px;border:1px solid var(--line);background:radial-gradient(700px 240px at 0% 0%,rgba(163,180,255,.09),transparent 70%),var(--surface)}
.hero h2{font-size:28px;margin-top:6px;letter-spacing:-.02em}
.hero .meta{margin-top:6px;color:var(--muted);font-size:12.5px;letter-spacing:.04em}
.cov{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;background:var(--raise);margin-top:22px}
.cov i{display:block;height:100%}
.cov .c{background:var(--ok)}.cov .p{background:var(--warn)}.cov .o{background:transparent}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:22px}
.step{padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);min-width:0}
.step .k{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.step .k b{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;font-family:var(--mono);font-size:10.5px;border:1px solid var(--line-2);color:var(--muted);font-weight:500}
.step.done .k b{background:var(--ok);border-color:var(--ok);color:#06140D}
.step .v{margin-top:4px;font-weight:500;font-size:13px}
.kpis{display:grid;gap:10px;align-content:start}
.kpi{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.kpi .n{font-family:var(--mono);font-size:30px;font-weight:500;line-height:1;letter-spacing:-.02em}
.kpi .l{font-size:12.5px;color:var(--muted);text-align:right}
.kpi.ok .n{color:var(--ok)}.kpi.warn .n{color:var(--warn)}.kpi.bad .n{color:var(--bad)}
.datebox{width:44px;flex:none;text-align:center;padding:5px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.datebox small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
.datebox b{display:block;font-family:var(--mono);font-size:17px;font-weight:500;line-height:1.1}
.logi{font-size:13px}
.logi b{font-weight:500}
.logi time{display:block;font-family:var(--mono);font-size:11px;color:var(--faint)}

/* Servidor */
.greet h2{font-size:26px;letter-spacing:-.02em}
.greet p{color:var(--muted);margin-top:4px}
.mycards{display:grid;gap:12px}
.mycard{padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;gap:14px}
.mycard.pending{border-color:rgba(232,183,85,.35);background:linear-gradient(180deg,rgba(232,183,85,.05),transparent 60%),var(--surface)}
.mycard .hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.mycard h3{font-size:18px}
.mycard .when{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:3px;letter-spacing:.03em}
.mycard .role{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.mycard .role b{font-weight:600}
.mycard .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contact{display:flex;align-items:center;gap:12px;padding:16px}
.contact .num{font-family:var(--mono);user-select:all}

/* Calendar */
.calbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.calbar h2{font-size:18px;min-width:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.wday{background:var(--surface);min-height:220px;display:flex;flex-direction:column;min-width:0}
.wday .wh{display:flex;align-items:baseline;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.wday .wh span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted)}
.wday .wh b{font-family:var(--mono);font-size:16px;font-weight:500}
.wday.today .wh b{color:var(--accent)}
.wday.today{background:linear-gradient(180deg,rgba(163,180,255,.06),transparent 40%),var(--surface)}
.wday .wb{padding:8px;display:grid;gap:6px;align-content:start}
.none{color:var(--faint);font-size:12px;padding:4px}
.evc{display:grid;gap:3px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface-2)}
.evc:hover{border-color:var(--accent)}
.evc .tm{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.evc .tt{font-weight:500;font-size:13px;line-height:1.3}
.evc .ft{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px}
.evc.culto .tm{color:var(--accent)}
.evc.mine{border-color:rgba(232,183,85,.45)}
.month{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mhead,.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mhead div{padding:8px 10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);background:var(--surface);border-bottom:1px solid var(--line)}
.mgrid{gap:1px;background:var(--line)}
.mcell{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mcell.out{background:var(--bg)}
.mcell.out .dn{color:var(--faint)}
.mcell .dn{font-family:var(--mono);font-size:12px;color:var(--muted);padding:2px 4px}
.mcell.today .dn{color:var(--accent-ink);background:var(--accent);border-radius:5px;align-self:flex-start;font-weight:500}
.mev{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:0;padding:3px 5px;border-radius:5px;background:var(--surface-2);font-size:11.5px;overflow:hidden;white-space:nowrap;min-width:0}
.mev:hover{background:var(--raise)}
.mev i{width:6px;height:6px;border-radius:50%;flex:none;background:var(--muted)}
.mev.culto i{background:var(--accent)}
.mev span{overflow:hidden;text-overflow:ellipsis}
.mlist{display:none}

/* Plan */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;display:grid;gap:1px;text-align:left;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.chip small{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.chip b{font-weight:500;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-dim)}
.planhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px;align-items:flex-start}
.planhead h2{font-size:20px}
.strip{display:flex;gap:2px;height:30px;border-radius:7px;overflow:hidden;margin:0 18px}
.strip div{min-width:0;display:flex;align-items:center;padding:0 7px;font-size:11px;color:var(--fg);background:var(--raise);overflow:hidden;white-space:nowrap}
.strip div:nth-child(odd){background:#262D40}
.strip div.hi{background:rgba(163,180,255,.28)}
.strip .rest{background:transparent!important;border:1px dashed var(--line-2);color:var(--faint)}
.durline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 18px 16px;font-size:12.5px;color:var(--muted)}
.durline .over{color:var(--warn)}
.items > li{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:14px;padding:14px 18px;border-top:1px solid var(--line);align-items:start}
.items .at{font-family:var(--mono);font-size:13px;color:var(--accent);padding-top:1px}
.items .at small{display:block;color:var(--faint);font-size:11px}
.items .ti{font-weight:600}
.items .rp{font-size:12.5px;color:var(--muted);margin-top:1px}
.items .nt{margin-top:7px;font-size:12.5px;color:var(--fg);padding:7px 10px;border-radius:7px;background:var(--bg);border:1px solid var(--line)}
.items .ctl{display:flex;gap:2px}
.items li.mine{background:linear-gradient(90deg,rgba(232,183,85,.06),transparent)}

/* Servidores */
.sumbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tgroup .panel-h h2{color:var(--fg);font-family:var(--sans);text-transform:none;letter-spacing:0;font-size:14px;font-weight:600}
.prow{display:grid;grid-template-columns:minmax(120px,1fr) minmax(0,1.4fr) auto auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .rl{font-weight:500;font-size:13px}
.prow .ps{display:flex;align-items:center;gap:9px;min-width:0}
.prow .ps span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .ps small{display:block;color:var(--muted);font-size:11.5px}
.prow .acts{display:flex;gap:6px;justify-content:flex-end}
.prow.open .rl{color:var(--muted)}
.strike{text-decoration:line-through;color:var(--muted)}

/* Personas */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.search input{padding-left:34px}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:500;padding:11px 16px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 16px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.tbl .who{display:flex;align-items:center;gap:10px;min-width:0}
.tbl .who b{font-weight:500;display:block}
.tbl .who small{color:var(--muted);font-size:12px}
.tbl tr.inactive .who b{color:var(--muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap}

/* Equipos */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.teamc{display:grid;gap:12px;text-align:left;padding:18px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.teamc:hover{border-color:var(--line-2);background:var(--surface-2)}
.teamc h3{font-size:16px}
.teamc .ld{font-size:12.5px;color:var(--muted)}
.teamc .ft{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.mini{display:flex;gap:2px;height:5px;width:90px;border-radius:9px;overflow:hidden;background:var(--raise)}
.mini i{display:block;height:100%}

/* Forms */
.field{display:grid;gap:6px;min-width:0}
.field label,.field .lb{font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);color:var(--fg);outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px}

<script>
/* ============ Datos ficticios ============ */
const TODAY = '2026-10-13';
const KEY = 'ebenezer-hub-demo-v1';
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

const DOWL = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

function buildSeed(){
  let n = 1;
  const P = (team, role, person = null, status = null, note = '') => ({ id: 'q' + (n++), team, role, person, status: person ? (status || 'pendiente') : null, note });
  const slug = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const H = (id, first, last, teams, phone, o = {}) => ({ id, first, last, teams, phone, email: o.noEmail ? '' : slug(first) + '.' + slug(last) + '@ejemplo.org', active: o.active !== false, blocked: o.blocked || [] });
  const people = [
    H('p0','Mariela','Sosa',[],'+54 9 11 5555-0100'),
    H('p1','Lucía','Ferreyra',['alabanza'],'+54 9 11 5555-0101'),
    H('p2','Sofía','Medina',['alabanza'],'+54 9 11 5555-0102'),
    H('p3','Martín','Quiroga',['alabanza'],'+54 9 11 5555-0103',{blocked:['2026-10-25']}),
    H('p4','Diego','Paz',['alabanza'],'',{blocked:['2026-10-18']}),
    H('p5','Nicolás','Herrera',['alabanza'],'+54 9 11 5555-0105'),
    H('p6','Camila','Ortiz',['alabanza'],'+54 9 11 5555-0106'),
    H('p7','Joaquín','Villalba',['alabanza','multimedia'],'+54 9 11 5555-0107'),
    H('p8','Tomás','Benítez',['sonido'],'+54 9 11 5555-0108'),
    H('p9','Hernán','Acosta',['sonido'],'+54 9 11 5555-0109'),

    H('p15','Agustina','Molina',['ninos','recepcion'],'+54 9 11 5555-0115'),
    H('p16','Ana','Gutiérrez',['intercesion'],'+54 9 11 5555-0116'),

    H('p18','Elena','Ibarra',['intercesion'],'',{active:false}),

  ];
  const teams = [
    {id:'alabanza',name:'Alabanza',leader:'p1',roles:['Dirección','Voz','Teclado','Guitarra','Bajo','Batería']},

    {id:'recepcion',name:'Recepción',leader:'p12',roles:['Bienvenida','Ujier']},
    {id:'intercesion',name:'Intercesión',leader:'p16',roles:['Intercesor']},
    {id:'ninos',name:'Niños',leader:'p14',roles:['Maestra','Asistente']},
    {id:'produccion',name:'Producción',leader:'p17',roles:['Coordinación']},
  ];
  const events = [
    {id:'e7',title:'Culto dominical',type:'culto',date:'2026-10-04',time:'10:00',dur:100,place:'Templo principal',desc:'',positions:[P('alabanza','Dirección','p1','confirmado'),P('alabanza','Teclado','p3','confirmado'),P('alabanza','Guitarra','p6','confirmado'),P('sonido','Operador de sonido','p9','confirmado'),P('multimedia','Proyección','p10','confirmado')]},
    {id:'e6',title:'Culto dominical',type:'culto',date:'2026-10-11',time:'10:00',dur:100,place:'Templo principal',desc:'',positions:[P('alabanza','Dirección','p1','confirmado'),P('alabanza','Voz','p2','confirmado'),P('alabanza','Teclado','p3','confirmado'),P('alabanza','Guitarra','p6','confirmado'),P('alabanza','Bajo','p4','confirmado'),P('alabanza','Batería','p5','confirmado'),P('sonido','Operador de sonido','p8','confirmado'),P('multimedia','Proyección','p11','confirmado'),P('multimedia','Transmisión','p7','confirmado'),P('recepcion','Bienvenida','p12','confirmado'),P('recepcion','Ujier','p13','confirmado'),P('ninos','Maestra','p14','confirmado'),P('ninos','Asistente','p15','confirmado')]},
    {id:'e0',title:'Reunión de oración',type:'evento',date:'2026-10-14',time:'20:00',dur:90,place:'Salón anexo',desc:'Oración por la iglesia y la ciudad.',positions:[P('intercesion','Intercesor','p16','confirmado'),P('sonido','Operador de sonido','p8','confirmado')]},
    {id:'e2',title:'Ensayo de alabanza',type:'evento',date:'2026-10-17',time:'17:00',dur:120,place:'Templo principal',desc:'Repaso del repertorio del domingo.',positions:[P('alabanza','Dirección','p1','confirmado'),P('alabanza','Voz','p2','confirmado'),P('alabanza','Teclado','p3','pendiente'),P('alabanza','Batería','p5','confirmado'),P('sonido','Operador de sonido','p9','confirmado')]},
    {id:'e1',title:'Culto dominical',type:'culto',date:'2026-10-18',time:'10:00',dur:100,place:'Templo principal',desc:'Serie «Piedra de ayuda» · 1 Samuel 7:12',positions:[
      P('alabanza','Dirección','p1','confirmado'),P('alabanza','Voz','p2','confirmado'),P('alabanza','Teclado','p3','pendiente'),P('alabanza','Guitarra'),P('alabanza','Bajo','p4','rechazado','Viaje familiar ese fin de semana'),P('alabanza','Batería','p5','confirmado'),
      P('sonido','Operador de sonido','p8','pendiente'),P('sonido','Asistente','p17','confirmado'),
      P('multimedia','Proyección','p10','confirmado'),P('multimedia','Transmisión'),
      P('recepcion','Bienvenida','p12','confirmado'),P('recepcion','Ujier','p13','pendiente'),
      P('ninos','Maestra','p14','confirmado'),P('ninos','Asistente'),
      P('intercesion','Intercesor','p16','confirmado')]},
    {id:'e5',title:'Reunión de líderes',type:'evento',date:'2026-10-20',time:'19:30',dur:90,place:'Oficina pastoral',desc:'Planificación de noviembre.',positions:[]},
    {id:'e3',title:'Culto de jóvenes',type:'culto',date:'2026-10-23',time:'20:30',dur:120,place:'Templo principal',desc:'',positions:[P('alabanza','Dirección','p7','pendiente'),P('alabanza','Voz','p6','confirmado'),P('sonido','Operador de sonido','p17','pendiente'),P('multimedia','Proyección','p11','confirmado')]},
    {id:'e4',title:'Culto dominical',type:'culto',date:'2026-10-25',time:'10:00',dur:100,place:'Templo principal',desc:'',positions:[P('alabanza','Dirección','p1','pendiente'),P('alabanza','Teclado'),P('sonido','Operador de sonido','p8','pendiente'),P('multimedia','Proyección'),P('recepcion','Bienvenida','p15','pendiente'),P('ninos','Maestra')]},
  ];
  const it = (title, dur, resp = '', notes = '') => ({ id: 'i' + (n++), title, dur, resp, notes });
  const plans = {
    e1: { items: [
      it('Bienvenida',5,'Pastor Esteban Ríos','Saludo y presentación de la serie.'),
      it('Alabanza',25,'Equipo de Alabanza','Set de 4 canciones. Cierre en Re.'),
      it('Oración pastoral',5,'Ana Gutiérrez'),
      it('Anuncios',5,'Mariela Sosa','Retiro de jóvenes: inscripción hasta el 31/10.'),
      it('Ofrenda',5,'Recepción','Instrumental de fondo.'),
      it('Predicación',40,'Pastor Esteban Ríos','1 Samuel 7:12. Slides a cargo de Multimedia.'),
      it('Cierre y bendición',5,'Pastor Esteban Ríos')]},
    e0: { items: [it('Bienvenida',5,'Ana Gutiérrez'),it('Lectura',10,'Ana Gutiérrez','Salmo 121'),it('Oración por la iglesia',30,'Intercesión'),it('Oración por la ciudad',30,'Intercesión'),it('Cierre',5,'Ana Gutiérrez')]},
  };
  const templates = [
    {id:'t1',name:'Culto dominical',items:[it('Bienvenida',5),it('Alabanza',25,'Equipo de Alabanza'),it('Oración',5),it('Anuncios',5),it('Ofrenda',5),it('Predicación',40),it('Cierre y bendición',5)]},
    {id:'t2',name:'Reunión de oración',items:[it('Bienvenida',5),it('Lectura',10),it('Oración en grupos',45),it('Cierre',5)]},
    {id:'t3',name:'Culto de jóvenes',items:[it('Bienvenida',5),it('Alabanza',30,'Equipo de Alabanza'),it('Dinámica',15),it('Mensaje',35),it('Cierre',5)]},
  ];
  const log = [
    {t:'13/10 18:40',who:'Lucía Ferreyra',txt:'asignó a Martín Quiroga en Teclado · Culto dominical 18/10'},
    {t:'13/10 17:12',who:'Diego Paz',txt:'rechazó Bajo · Culto dominical 18/10'},
    {t:'13/10 11:05',who:'Mariela Sosa',txt:'armó el plan del Culto dominical 18/10'},
    {t:'12/10 21:30',who:'Valentina Romero',txt:'confirmó Proyección · Culto dominical 18/10'},
    {t:'12/10 09:14',who:'Mariela Sosa',txt:'creó el evento Reunión de líderes 20/10'},
  ];
  return { people, teams, events, plans, templates, log, seq: n };
}

let S;
try { S = JSON.parse(localStorage.getItem(KEY)) } catch (e) { S = null }
if (!S || !S.events) S = buildSeed();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)) } catch (e) {} }
const uid = p => p + (S.seq++);

const ROLES = { admin:{label:'Administración',user:'p0'}, lider:{label:'Líder de Alabanza',user:'p1'}, servidor:{label:'Servidor · Sonido',user:'p8'} };
const UI = { role:'admin', view:'inicio', calMode:'semana', calAnchor:TODAY, planEvent:null, srvEvent:null, pq:'', pteam:'', pest:'activos', modal:null, csv:null };
try { const r = localStorage.getItem(KEY + '-role'); if (r && ROLES[r]) UI.role = r } catch (e) {}

/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const D = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d) };
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addDays = (s, k) => { const d = D(s); d.setDate(d.getDate() + k); return iso(d) };
const daysFrom = s => Math.round((D(s) - D(TODAY)) / 864e5);
const rel = s => { const k = daysFrom(s); return k === 0 ? 'Hoy' : k === 1 ? 'Mañana' : k > 1 ? 'En ' + k + ' días' : 'Hace ' + (-k) + ' días' };
const fmtShort = s => { const d = D(s); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MES[d.getMonth()] };
const fmtTag = s => fmtShort(s).toUpperCase();
const fmtLong = s => { const d = D(s); return DOWL[d.getDay()] + ' ' + d.getDate() + ' de ' + MESL[d.getMonth()] };
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m };
const toTime = m => pad(Math.floor(m / 60) % 24) + ':' + pad(m % 60);
const endTime = e => toTime(toMin(e.time) + e.dur);
const weekStart = s => addDays(s, -((D(s).getDay() + 6) % 7));
const byDT = (a, b) => (a.date + a.time).localeCompare(b.date + b.time);

const ev = id => S.events.find(e => e.id === id);
const per = id => S.people.find(p => p.id === id);
const team = id => S.teams.find(t => t.id === id);
const fullName = p => p ? p.first + ' ' + p.last : '—';
const nm = id => fullName(per(id));
const ini = p => p ? (p.first[0] + p.last[0]).toUpperCase() : '?';
const av = (p, cls = '') => `<span class="av ${cls}" aria-hidden="true">${esc(ini(p))}</span>`;
const me = () => per(ROLES[UI.role].user);
const myTeams = () => S.teams.filter(t => t.leader === me().id).map(t => t.id);
const upcoming = () => S.events.filter(e => e.date >= TODAY).sort(byDT);
const nextCulto = () => upcoming().find(e => e.type === 'culto');
const evLabel = e => { const d = D(e.date); return e.title + ' ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1) };
const isOpen = p => !p.person || p.status === 'rechazado';
function stats(e, teamId){
  const ps = e.positions.filter(p => !teamId || p.team === teamId);
  return { total: ps.length, conf: ps.filter(p => p.status === 'confirmado').length, pend: ps.filter(p => p.status === 'pendiente').length, open: ps.filter(isOpen).length };
}
function lastServed(pid){
  const past = S.events.filter(e => e.date < TODAY && e.positions.some(p => p.person === pid && p.status === 'confirmado')).sort(byDT);
  return past.length ? past[past.length - 1].date : null;
}
function load30(pid){
  return S.events.filter(e => e.date >= TODAY && daysFrom(e.date) <= 30).reduce((a, e) => a + e.positions.filter(p => p.person === pid && p.status !== 'rechazado').length, 0);
}
const overlap = (a, b) => a.date === b.date && toMin(a.time) < toMin(b.time) + b.dur && toMin(b.time) < toMin(a.time) + a.dur;

function candidates(e, pos){
  return S.people.filter(p => p.teams.includes(pos.team)).map(p => {
    let reason = null;
    if (!p.active) reason = 'Inactivo';
    else if (p.id === pos.person && pos.status === 'rechazado') reason = 'Rechazó esta posición';
    else if (p.blocked.includes(e.date)) reason = 'Marcó no disponible ese día';
    else {
      const dup = e.positions.find(x => x.person === p.id && x.id !== pos.id && x.status !== 'rechazado');
      if (dup) reason = 'Ya sirve como ' + dup.role + ' en este evento';
      else {
        const clash = S.events.find(o => o.id !== e.id && overlap(o, e) && o.positions.some(x => x.person === p.id && x.status !== 'rechazado'));
        if (clash) reason = 'Se superpone con ' + clash.title;
      }
    }
    return { p, reason, last: lastServed(p.id), load: load30(p.id), current: p.id === pos.person && pos.status !== 'rechazado' };
  }).sort((a, b) => (!!a.reason - !!b.reason) || (a.load - b.load));
}

function viewCal(){
  const a = UI.calAnchor, isW = UI.calMode === 'semana';
  let label, body;
  if (isW){
    const ws = weekStart(a), days = [...Array(7)].map((_, i) => addDays(ws, i));
    const d0 = D(days[0]), d6 = D(days[6]);
    label = d0.getMonth() === d6.getMonth() ? `${d0.getDate()} – ${d6.getDate()} de ${MESL[d6.getMonth()]}` : `${d0.getDate()} ${MES[d0.getMonth()]} – ${d6.getDate()} ${MES[d6.getMonth()]}`;
    body = `<div class="week">${days.map(d => { const es = S.events.filter(e => e.date === d).sort(byDT); return `<div class="wday ${d === TODAY ? 'today' : ''}"><div class="wh"><span>${DOW[D(d).getDay()].toUpperCase()}</span><b>${D(d).getDate()}</b></div><div class="wb">${es.map(evCard).join('') || '<span class="none">—</span>'}</div></div>` }).join('')}</div>`;
  } else {
    const ad = D(a), y = ad.getFullYear(), mo = ad.getMonth();
    const first = iso(new Date(y, mo, 1)), last = iso(new Date(y, mo + 1, 0));
    const start = weekStart(first); const cells = []; let c = start;
    while (c <= last || cells.length % 7) { cells.push(c); c = addDays(c, 1) }
    label = `${MESL[mo][0].toUpperCase() + MESL[mo].slice(1)} ${y}`;
    const monthEvs = S.events.filter(e => e.date >= first && e.date <= last).sort(byDT);
    body = `<div class="month"><div class="mhead">${['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'].map(x => `<div>${x}</div>`).join('')}</div><div class="mgrid">${cells.map(d => { const es = S.events.filter(e => e.date === d).sort(byDT); const out = D(d).getMonth() !== mo; return `<div class="mcell ${out ? 'out' : ''} ${d === TODAY ? 'today' : ''}"><span class="dn">${D(d).getDate()}</span><div class="evs" style="display:grid;gap:3px">${es.map(e => `<button class="mev ${e.type}" data-a="evOpen" data-e="${e.id}" title="${esc(e.time + ' ' + e.title)}"><i></i><span class="mono">${e.time}</span><span>${esc(e.title)}</span></button>`).join('')}</div></div>` }).join('')}</div></div>
    <section class="panel mlist"><div class="panel-h"><h2>Eventos de ${MESL[mo]}</h2></div><ul class="rows">${monthEvs.map(e => `<li>${dateBox(e.date)}<button style="all:unset;flex:1;min-width:0;cursor:pointer" data-a="evOpen" data-e="${e.id}"><div class="t">${esc(e.title)}</div><div class="s mono">${e.time} · ${esc(e.place)}</div></button></li>`).join('')}</ul></section>`;
  }
  return `<div class="calbar">
    <div class="seg"><button data-a="calMode" data-m="semana" aria-pressed="${isW}">Semana</button><button data-a="calMode" data-m="mes" aria-pressed="${!isW}">Mes</button></div>
    <button class="icobtn" data-a="calNav" data-d="-1" aria-label="Anterior">${ico('left')}</button><button class="icobtn" data-a="calNav" data-d="1" aria-label="Siguiente">${ico('right')}</button>
    <button class="btn sm" data-a="calToday">Hoy</button><h2>${label}</h2><span class="spacer"></span>
    ${UI.role === 'admin' ? `<button class="btn pri" data-a="newEvent">${ico('plus')}Nuevo evento</button>` : ''}
  </div>${body}`;
}

/* ============ Plan de culto ============ */
function planTimes(e, plan){ let t = toMin(e.time); return plan.items.map(i => { const r = { ...i, at: toTime(t) }; t += Number(i.dur) || 0; return r }) }
function eventChips(cur, act, filter = () => true){
  return `<div class="chips" role="group" aria-label="Elegir evento">${upcoming().filter(filter).map(e => `<button class="chip" data-a="${act}" data-e="${e.id}" aria-pressed="${e.id === cur}"><small>${fmtTag(e.date)} · ${e.time}</small><b>${esc(e.title)}</b></button>`).join('')}</div>`;
}
function viewPlan(){
  if (!UI.planEvent || !ev(UI.planEvent) || ev(UI.planEvent).date < TODAY) UI.planEvent = nextCulto().id;
  const e = ev(UI.planEvent), plan = S.plans[e.id], edit = UI.role === 'admin';
  const myRole = UI.role === 'servidor' ? e.positions.find(p => p.person === me().id) : null;
  const teamsIn = [...new Set(e.positions.map(p => p.team))].map(team);
  let content;
  if (!plan){
    content = `<div class="empty" style="padding:36px 18px;display:grid;gap:14px;justify-items:center"><div style="font-size:15px;color:var(--fg);font-weight:500">Este evento todavía no tiene plan</div><div>${edit ? 'Empezá desde una plantilla o agregá los elementos uno por uno.' : 'Cuando la administración lo publique, lo vas a ver acá.'}</div>${edit ? `<div class="row" style="justify-content:center">${S.templates.map(t => `<button class="btn" data-a="applyTpl" data-e="${e.id}" data-t="${t.id}">${ico('tpl')}${esc(t.name)}</button>`).join('')}<button class="btn ghost" data-a="addItem" data-e="${e.id}">${ico('plus')}En blanco</button></div>` : ''}</div>`;
  } else {
    const items = planTimes(e, plan), total = items.reduce((a, i) => a + Number(i.dur), 0), diff = total - e.dur;
    const hiTitles = myRole ? ['Alabanza','Predicación','Mensaje'] : [];
    content = `
      <div class="strip" aria-hidden="true">${items.map(i => `<div style="flex:${i.dur}" class="${hiTitles.includes(i.title) && myRole && myRole.team === 'alabanza' ? 'hi' : ''}" title="${esc(i.title)} · ${i.dur} min">${esc(i.title)}</div>`).join('')}${diff < 0 ? `<div class="rest" style="flex:${-diff}">Libre</div>` : ''}</div>
      <div class="durline"><span class="mono">${e.time} → ${toTime(toMin(e.time) + total)} · ${total} de ${e.dur} min</span>${diff > 0 ? `<span class="over">Se excede ${diff} min del horario previsto</span>` : `<span>${-diff} min de margen</span>`}</div>
      <ol class="items">${items.map((i, k) => `<li>
        <div class="at">${i.at}<small>${i.dur} min</small></div>
        <div style="min-width:0"><div class="ti">${esc(i.title)}</div><div class="rp">${esc(i.resp || 'Sin responsable')}</div>${i.notes ? `<div class="nt">${esc(i.notes)}</div>` : ''}</div>
        ${edit ? `<div class="ctl"><button class="icobtn" data-a="mvItem" data-e="${e.id}" data-i="${i.id}" data-d="-1" ${k === 0 ? 'disabled' : ''} aria-label="Subir">${ico('up')}</button><button class="icobtn" data-a="mvItem" data-e="${e.id}" data-i="${i.id}" data-d="1" ${k === items.length - 1 ? 'disabled' : ''} aria-label="Bajar">${ico('down')}</button><button class="icobtn" data-a="editItem" data-e="${e.id}" data-i="${i.id}" aria-label="Editar">${ico('edit')}</button><button class="icobtn" data-a="delItem" data-e="${e.id}" data-i="${i.id}" aria-label="Eliminar">${ico('trash')}</button></div>` : '<div></div>'}
      </li>`).join('')}</ol>`;
  }
  return `${eventChips(e.id, 'pickPlan')}
  <section class="panel">
    <div class="planhead"><div style="min-width:0"><div class="eyebrow">${fmtTag(e.date)} · ${e.time}–${endTime(e)} · ${esc(e.place.toUpperCase())}</div><h2 style="margin-top:4px">${esc(e.title)}</h2>${e.desc ? `<p class="muted" style="margin-top:4px">${esc(e.desc)}</p>` : ''}
      <div class="tags" style="margin-top:10px">${teamsIn.length ? teamsIn.map(t => `<span class="tag">${esc(t.name)}</span>`).join('') : '<span class="faint" style="font-size:12.5px">Sin equipos asignados</span>'}</div>
      ${myRole ? `<div style="margin-top:10px"><span class="pill warn">Tu rol: ${esc(myRole.role)}</span></div>` : ''}</div>
      ${edit && plan ? `<div class="row"><button class="btn" data-a="tplPick" data-e="${e.id}">${ico('tpl')}Plantilla</button><button class="btn" data-a="tplSave" data-e="${e.id}">Guardar como plantilla</button><button class="btn pri" data-a="addItem" data-e="${e.id}">${ico('plus')}Elemento</button></div>` : ''}
    </div>
    ${content}
  </section>
  ${!edit ? '<div class="note">Vista de solo lectura. La administración arma y edita el plan.</div>' : ''}`;
}

Paula,Giménez,+54 9 11 5555-0190,paula.gimenez@ejemplo.org,Recepción

function parseCSV(txt){
  const lines = txt.trim().split(/\r?\n/).filter(Boolean);
  if (!lines.length) return [];
  const head = lines[0].split(',').map(h => h.trim().toLowerCase());
  const idx = k => head.indexOf(k);
  return lines.slice(1).map((ln, k) => {
    const c = ln.split(',').map(x => x.trim());
    const r = { line: k + 2, first: c[idx('nombre')] || '', last: c[idx('apellido')] || '', phone: c[idx('telefono')] || '', email: c[idx('email')] || '', teamsRaw: c[idx('equipos')] || '' };
    const names = r.teamsRaw ? r.teamsRaw.split(';').map(x => x.trim()).filter(Boolean) : [];
    r.teams = names.map(n => S.teams.find(t => t.name.toLowerCase() === n.toLowerCase())).filter(Boolean).map(t => t.id);
    if (!r.first || !r.last) r.err = 'Falta nombre o apellido';
    else if (r.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email)) r.err = 'Email inválido';
    else if (r.teams.length !== names.length) r.err = 'Equipo desconocido';
    else if (S.people.some(p => fullName(p).toLowerCase() === (r.first + ' ' + r.last).toLowerCase())) r.err = 'Ya existe (posible duplicado)';
    return r;
  });
}

  addPos: (f, data) => {
    const e = ev(f.dataset.e), t = data.get('team'), r = data.get('role');
    e.positions.push({ id: uid('q'), team: t, role: r, person: null, status: null, note: '' });
    log(`agregó la posición ${r} (${team(t).name}) · ${evLabel(e)}`); save(); closeModal(); render(); toast('Posición agregada', r);
  },
  member: (f, data) => {
    const id = data.get('id'); if (!id) return; const p = per(id), t = team(f.dataset.t);
    p.teams.push(t.id); log(`sumó a ${fullName(p)} a ${t.name}`); save(); render(); toast(`${fullName(p)} se sumó a ${t.name}`);
  },
  role: (f, data) => {
    const r = (data.get('role') || '').toString().trim(), t = team(f.dataset.t);
    if (!r || t.roles.some(x => x.toLowerCase() === r.toLowerCase())){ toast(r ? 'Ese rol ya existe' : 'Escribí el nombre del rol', '', true); return }
    t.roles.push(r); log(`agregó el rol ${r} a ${t.name}`); save(); render(); toast('Rol agregado', r);
  },
};

document.addEventListener('click', ev_ => {
  const b = ev_.target.closest('[data-a]');
  if (b && !b.disabled && A[b.dataset.a]){ ev_.preventDefault(); A[b.dataset.a](b.dataset, b); return }
  if (ev_.target.id === 'modal') closeModal();
});
document.addEventListener('submit', e => { e.preventDefault(); const f = e.target; if (F[f.dataset.form]) F[f.dataset.form](f, new FormData(f)) });
document.addEventListener('input', e => { if (e.target.id === 'pq'){ UI.pq = e.target.value; renderPeopleRows() } });
document.addEventListener('change', e => {
  if (e.target.id === 'pteam'){ UI.pteam = e.target.value; renderPeopleRows() }
  if (e.target.dataset.change === 'posTeam'){ UI.modal.t = e.target.value; renderModal() }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.modal) closeModal() });

render();
</script>

</body></html>
